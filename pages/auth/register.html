<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Regisztráció - Project Hub</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../pages.css"
    >

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>

<body>

    <header class="header">

        <div>

            <h1>REGISZTRÁCIÓ</h1>

            <p>
                Project Hub
            </p>

        </div>

        <a
            href="../../index.html"
            class="back-button"
        >
            <span class="back-arrow"></span>
        </a>

    </header>


    <main class="page-content login-page">

        <section class="page-intro">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                👋 Fiók létrehozása
            </h2>

            <p>
                Hozd létre a saját Project Hub fiókodat.
            </p>

        </section>


        <section class="page-section login-section">

            <form id="registerForm">

                <div class="form-group">

                    <label for="username">
                        Felhasználónév
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Felhasználónév"
                        autocomplete="username"
                        minlength="3"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        E-mail cím
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="pelda@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Jelszó
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Legalább 6 karakter"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="passwordConfirm">
                        Jelszó újra
                    </label>

                    <input
                        type="password"
                        id="passwordConfirm"
                        name="passwordConfirm"
                        placeholder="Jelszó újra"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>


                <div
                    id="registerMessage"
                    class="login-message"
                ></div>


                <button
                    type="submit"
                    id="registerButton"
                    class="login-button"
                >
                    Regisztráció
                </button>

            </form>

        </section>


        <section class="login-register">

            <p>
                Már van fiókod?
            </p>

            <a href="login.html">
                Bejelentkezés
            </a>

        </section>

    </main>


    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const BACKEND_URL =
                    "https://project-hub-backend-1.onrender.com";


                const registerForm =
                    document.getElementById(
                        "registerForm"
                    );

                const registerButton =
                    document.getElementById(
                        "registerButton"
                    );

                const registerMessage =
                    document.getElementById(
                        "registerMessage"
                    );

                const usernameInput =
                    document.getElementById(
                        "username"
                    );

                const emailInput =
                    document.getElementById(
                        "email"
                    );

                const passwordInput =
                    document.getElementById(
                        "password"
                    );

                const passwordConfirmInput =
                    document.getElementById(
                        "passwordConfirm"
                    );


                if (
                    !registerForm ||
                    !registerButton ||
                    !registerMessage ||
                    !usernameInput ||
                    !emailInput ||
                    !passwordInput ||
                    !passwordConfirmInput
                ) {

                    console.error(
                        "A regisztrációs oldal egyik eleme hiányzik."
                    );

                    return;
                }


                function showError(message) {

                    registerMessage.textContent =
                        message;

                    registerMessage.className =
                        "login-message error";

                }


                function showSuccess(message) {

                    registerMessage.textContent =
                        message;

                    registerMessage.className =
                        "login-message success";

                }


                function clearMessage() {

                    registerMessage.textContent =
                        "";

                    registerMessage.className =
                        "login-message";

                }


                registerForm.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        const username =
                            usernameInput.value.trim();

                        const email =
                            emailInput.value.trim();

                        const password =
                            passwordInput.value;

                        const passwordConfirm =
                            passwordConfirmInput.value;


                        if (
                            !username ||
                            !email ||
                            !password ||
                            !passwordConfirm
                        ) {

                            showError(
                                "Minden mező kitöltése kötelező."
                            );

                            return;
                        }


                        if (
                            username.length < 3
                        ) {

                            showError(
                                "A felhasználónév legalább 3 karakter legyen."
                            );

                            return;
                        }


                        if (
                            password.length < 6
                        ) {

                            showError(
                                "A jelszó legalább 6 karakter legyen."
                            );

                            return;
                        }


                        if (
                            password !==
                            passwordConfirm
                        ) {

                            showError(
                                "A két jelszó nem egyezik."
                            );

                            return;
                        }


                        clearMessage();


                        registerButton.disabled =
                            true;

                        registerButton.textContent =
                            "Regisztráció...";


                        try {

                            console.log(
                                "Regisztráció indítása..."
                            );


                            const response =
                                await fetch(
                                    BACKEND_URL +
                                    "/api/auth/register",
                                    {
                                        method:
                                            "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        credentials:
                                            "include",

                                        body:
                                            JSON.stringify({

                                                username:
                                                    username,

                                                email:
                                                    email,

                                                password:
                                                    password

                                            })

                                    }
                                );


                            const result =
                                await response.json();


                            console.log(
                                "REGISZTRÁCIÓ VÁLASZ:",
                                result
                            );


                            if (
                                !response.ok
                            ) {

                                throw new Error(
                                    result.message ||
                                    "A regisztráció sikertelen."
                                );

                            }


                            if (
                                result.token
                            ) {

                                localStorage.setItem(
                                    "projectHubAuthToken",
                                    result.token
                                );

                            }


                            showSuccess(
                                "✅ Sikeres regisztráció!"
                            );


                            console.log(
                                "Létrehozott felhasználó:",
                                result.user
                            );


                            setTimeout(
                                function () {

                                    window.location.href =
                                        "../../index.html";

                                },
                                800
                            );

                        }
                        catch (error) {

                            console.error(
                                "Regisztrációs hiba:",
                                error
                            );


                            showError(
                                error.message ||
                                "Nem sikerült a regisztráció."
                            );

                        }
                        finally {

                            registerButton.disabled =
                                false;

                            registerButton.textContent =
                                "Regisztráció";

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
