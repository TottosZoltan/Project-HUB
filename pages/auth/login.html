<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bejelentkezés - Project Hub</title>

    <link
        rel="stylesheet"
        href="../../style.css"
    >

    <link
        rel="stylesheet"
        href="../pages.css"
    >

    <link
        rel="stylesheet"
        href="login.css"
    >

</head>

<body>

    <header class="header">

        <div>

            <h1>BEJELENTKEZÉS</h1>

            <p>
                Project Hub
            </p>

        </div>

        <a
            href="../../index.html"
            class="back-button"
        >
            <span class="back-arrow"></span>
        </a>

    </header>


    <main class="page-content login-page">

        <section class="page-intro">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                🔐 Üdv újra!
            </h2>

            <p>
                Jelentkezz be a Project Hub fiókodba.
            </p>

        </section>


        <section class="page-section login-section">

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        E-mail cím
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="pelda@email.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Jelszó
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Jelszó"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <div
                    id="loginMessage"
                    class="login-message"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Bejelentkezés
                </button>

            </form>

        </section>


        <section class="login-register">

            <p>
                Még nincs fiókod?
            </p>

            <a href="register.html">
                Regisztráció
            </a>

        </section>

    </main>


    <!-- =========================================
         BEJELENTKEZÉS JAVASCRIPT
         ========================================= -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const BACKEND_URL =
                    "https://project-hub-backend-1.onrender.com";


                const loginForm =
                    document.getElementById(
                        "loginForm"
                    );

                const loginButton =
                    document.getElementById(
                        "loginButton"
                    );

                const loginMessage =
                    document.getElementById(
                        "loginMessage"
                    );

                const emailInput =
                    document.getElementById(
                        "email"
                    );

                const passwordInput =
                    document.getElementById(
                        "password"
                    );


                // =========================================
                // ELLENŐRZÉS
                // =========================================

                if (
                    !loginForm ||
                    !loginButton ||
                    !loginMessage ||
                    !emailInput ||
                    !passwordInput
                ) {

                    console.error(
                        "HIBA: A bejelentkezési oldal egyik eleme hiányzik."
                    );

                    return;
                }


                // =========================================
                // HIBA ÜZENET
                // =========================================

                function showError(
                    message
                ) {

                    loginMessage.textContent =
                        message;

                    loginMessage.className =
                        "login-message error";

                }


                // =========================================
                // SIKER ÜZENET
                // =========================================

                function showSuccess(
                    message
                ) {

                    loginMessage.textContent =
                        message;

                    loginMessage.className =
                        "login-message success";

                }


                // =========================================
                // ÜZENET TÖRLÉSE
                // =========================================

                function clearMessage() {

                    loginMessage.textContent =
                        "";

                    loginMessage.className =
                        "login-message";

                }


                // =========================================
                // BEJELENTKEZÉS
                // =========================================

                loginForm.addEventListener(
                    "submit",
                    async function (event) {

                        event.preventDefault();


                        const email =
                            emailInput.value.trim();

                        const password =
                            passwordInput.value;


                        // =========================================
                        // ÜRES MEZŐK
                        // =========================================

                        if (
                            !email ||
                            !password
                        ) {

                            showError(
                                "Az e-mail cím és a jelszó kötelező."
                            );

                            return;
                        }


                        clearMessage();


                        loginButton.disabled =
                            true;

                        loginButton.textContent =
                            "Bejelentkezés...";


                        try {

                            console.log(
                                "Bejelentkezés indítása..."
                            );


                            // =========================================
                            // LOGIN KÉRÉS
                            // =========================================

                            const response =
                                await fetch(
                                    BACKEND_URL +
                                    "/api/auth/login",
                                    {
                                        method:
                                            "POST",

                                        headers: {
                                            "Content-Type":
                                                "application/json"
                                        },

                                        credentials:
                                            "include",

                                        body:
                                            JSON.stringify({

                                                username:
                                                    email,

                                                password:
                                                    password

                                            })
                                    }
                                );


                            // =========================================
                            // VÁLASZ
                            // =========================================

                            const result =
                                await response.json();


                            console.log(
                                "LOGIN VÁLASZ:",
                                result
                            );


                            // =========================================
                            // HIBA
                            // =========================================

                            if (
                                !response.ok
                            ) {

                                throw new Error(
                                    result.message ||
                                    "A bejelentkezés sikertelen."
                                );

                            }


                            // =========================================
                            // TOKEN ELLENŐRZÉS
                            // =========================================

                            if (
                                !result.token
                            ) {

                                console.error(
                                    "A backend nem küldött auth tokent."
                                );

                                throw new Error(
                                    "A bejelentkezés sikerült, de az authentikációs token hiányzik."
                                );

                            }


                            // =========================================
                            // TOKEN MENTÉSE
                            // =========================================

                            localStorage.setItem(
                                "projectHubAuthToken",
                                result.token
                            );


                            console.log(
                                "Auth token elmentve."
                            );


                            // =========================================
                            // SIKER
                            // =========================================

                            showSuccess(
                                "✅ Sikeres bejelentkezés!"
                            );


                            console.log(
                                "Bejelentkezett felhasználó:",
                                result.user
                            );


                            // =========================================
                            // FŐOLDALRA LÉPÉS
                            // =========================================

                            setTimeout(
                                function () {

                                    window.location.href =
                                        "../../index.html";

                                },
                                700
                            );

                        }
                        catch (error) {

                            console.error(
                                "Bejelentkezési hiba:",
                                error
                            );


                            showError(
                                error.message ||
                                "Nem sikerült bejelentkezni."
                            );

                        }
                        finally {

                            loginButton.disabled =
                                false;

                            loginButton.textContent =
                                "Bejelentkezés";

                        }

                    }
                );

            }
        );

    </script>

</body>

</html>
