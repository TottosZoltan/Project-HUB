<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jegyzetek - Project Hub</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="pages.css">
</head>

<body>

    <!-- =========================================
         FEJLÉC
    ========================================= -->

    <header class="header">

        <div>
            <h1>JEGYZETEK</h1>
            <p>Project Hub</p>
        </div>

        <a href="../" class="back-button">
            <span class="back-arrow"></span>
        </a>

    </header>


    <!-- =========================================
         JEGYZETEK OLDAL
    ========================================= -->

    <main class="page-content notes-page">

        <!-- BEVEZETŐ -->

        <section class="page-intro">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                📝 Jegyzeteim
            </h2>

            <p>
                Mentsd el az ötleteidet és fontos gondolataidat.
            </p>

        </section>


        <!-- =====================================
             ÚJ JEGYZET
        ===================================== -->

        <section class="notes-editor">

            <input
                type="text"
                id="noteTitle"
                placeholder="Jegyzet címe..."
                maxlength="100"
            >

            <textarea
                id="noteText"
                placeholder="Írd ide a jegyzeted..."
                rows="7"
            ></textarea>

            <button
                id="saveNote"
                class="save-note-button"
                type="button"
            >
                💾 Jegyzet mentése
            </button>

        </section>


        <!-- =====================================
             MENTETT JEGYZETEK
        ===================================== -->

        <section class="notes-section">

            <div class="section-header">

                <h2>
                    📋 Mentett jegyzetek
                </h2>

                <span id="noteTotal">
                    0 db
                </span>

            </div>


            <div
                id="notesList"
                class="notes-list"
            ></div>


            <!-- ÜRES ÁLLAPOT -->

            <div
                id="emptyNotes"
                class="empty-notes"
            >

                <div class="empty-icon">
                    📝
                </div>

                <h3>
                    Még nincs jegyzeted
                </h3>

                <p>
                    Írj egyet fent és mentsd el.
                </p>

            </div>

        </section>

    </main>


    <!-- =========================================
         TELJES JEGYZET MODAL
    ========================================= -->

    <div
        id="noteModal"
        class="note-modal"
    >

        <div class="note-modal-overlay"></div>


        <div
            class="note-modal-card"
            role="dialog"
            aria-modal="true"
        >

            <!-- MODAL FEJLÉC -->

            <div class="note-modal-header">

                <h2 id="modalNoteTitle">
                    Jegyzet
                </h2>

                <button
                    id="closeNoteModal"
                    class="close-note-modal"
                    type="button"
                    aria-label="Bezárás"
                >
                    ✕
                </button>

            </div>


            <!-- TELJES JEGYZET -->

            <div
                id="modalNoteText"
                class="note-modal-text"
            ></div>


            <!-- DÁTUM -->

            <div
                id="modalNoteDate"
                class="note-modal-date"
            ></div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="../script.js"></script>
    <script src="notes.js"></script>

</body>

</html>
