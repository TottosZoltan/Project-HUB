<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Jegyzetek - Project Hub</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="pages.css">
    <link rel="stylesheet" href="notes.css">

</head>


<body>


    <!-- =========================================
         FEJLÉC
    ========================================= -->

    <header class="header">

        <div>

            <h1>JEGYZETEK</h1>

            <p>Project Hub</p>

        </div>


        <a
            href="../"
            class="back-button"
        >

            <span class="back-arrow"></span>

        </a>

    </header>



    <!-- =========================================
         FŐ TARTALOM
    ========================================= -->

    <main class="page-content notes-page">


        <!-- =====================================
             BEVEZETŐ
        ===================================== -->

        <section class="page-intro">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                📝 Jegyzeteim
            </h2>

            <p>
                Mentsd el az ötleteidet és fontos gondolataidat.
            </p>

        </section>



        <!-- =====================================
             ÚJ JEGYZET
        ===================================== -->

        <!-- =====================================
     MODUL GOMBOK
===================================== -->

<div class="module-actions">

    <button
        id="toggleNoteEditor"
        class="module-toggle-button"
        type="button"
    >
        ➕ Új jegyzet
    </button>

    <button
        id="toggleNoteFilters"
        class="module-toggle-button"
        type="button"
    >
        🔎 Keresés és szűrés
    </button>

</div>


<!-- =====================================
     ÚJ JEGYZET
===================================== -->

<section
    class="notes-editor collapsible-panel"
    id="noteEditor"
>


            <!-- CÍM -->

            <input
                type="text"
                id="noteTitle"
                placeholder="Jegyzet címe..."
                maxlength="100"
            >


            <!-- KATEGÓRIA -->

            <select id="noteCategory">

                <option value="Egyéb">
                    📁 Egyéb
                </option>

                <option value="Ötlet">
                    💡 Ötlet
                </option>

                <option value="Munka">
                    💼 Munka
                </option>

                <option value="Személyes">
                    👤 Személyes
                </option>

                <option value="Fontos">
                    ⭐ Fontos
                </option>

                <option value="Projekt">
                    🚀 Projekt
                </option>

            </select>


            <!-- SZÖVEG -->

            <textarea
                id="noteText"
                placeholder="Írd ide a jegyzeted..."
                rows="7"
            ></textarea>


            <!-- MENTÉS -->

            <button
                id="saveNote"
                class="save-note-button"
                type="button"
            >

                💾 Jegyzet mentése

            </button>

        </section>



        <!-- =====================================
             KERESÉS + SZŰRÉS
        ===================================== -->

        <section class="notes-tools">


            <!-- KERESÉS -->

            <div class="notes-search">

                <span class="search-icon">
                    🔍
                </span>

                <input
                    type="search"
                    id="noteSearch"
                    placeholder="Keresés a jegyzetek között..."
                    autocomplete="off"
                >

            </div>


            <!-- SZŰRŐK -->

            <div class="notes-filters">


                <select id="categoryFilter">

                    <option value="all">
                        📁 Minden kategória
                    </option>

                    <option value="Ötlet">
                        💡 Ötlet
                    </option>

                    <option value="Munka">
                        💼 Munka
                    </option>

                    <option value="Személyes">
                        👤 Személyes
                    </option>

                    <option value="Fontos">
                        ⭐ Fontos
                    </option>

                    <option value="Projekt">
                        🚀 Projekt
                    </option>

                    <option value="Egyéb">
                        📁 Egyéb
                    </option>

                </select>


                <select id="sortNotes">

                    <option value="newest">
                        🕐 Legújabb
                    </option>

                    <option value="oldest">
                        🕐 Legrégebbi
                    </option>

                    <option value="az">
                        🔤 A → Z
                    </option>

                    <option value="za">
                        🔤 Z → A
                    </option>

                </select>

            </div>

        </section>



        <!-- =====================================
             MENTETT JEGYZETEK
        ===================================== -->

        <section class="notes-section">


            <!-- FEJLÉC -->

            <div class="section-header">

                <h2>
                    📋 Mentett jegyzetek
                </h2>

                <span id="noteTotal">
                    0 db
                </span>

            </div>



            <!-- JEGYZETEK -->

            <div
                id="notesList"
                class="notes-list"
            ></div>



            <!-- NINCS JEGYZET -->

            <div
                id="emptyNotes"
                class="empty-notes"
            >

                <div class="empty-icon">
                    📝
                </div>

                <h3>
                    Még nincs jegyzeted
                </h3>

                <p>
                    Írj egyet fent és mentsd el.
                </p>

            </div>



            <!-- NINCS TALÁLAT -->

            <div
                id="noSearchResults"
                class="empty-notes no-search-results"
            >

                <div class="empty-icon">
                    🔍
                </div>

                <h3>
                    Nincs találat
                </h3>

                <p>
                    Próbálj más keresést vagy szűrőt.
                </p>

            </div>


        </section>

    </main>



    <!-- =========================================
         TELJES JEGYZET MODAL
    ========================================= -->

    <div
        id="noteModal"
        class="note-modal"
    >


        <!-- HÁTTÉR -->

        <div class="note-modal-overlay"></div>



        <!-- KÁRTYA -->

        <div
            class="note-modal-card"
            role="dialog"
            aria-modal="true"
        >


            <!-- FEJLÉC -->

            <div class="note-modal-header">

                <div class="modal-note-heading">

                    <span
                        id="modalNoteCategory"
                        class="modal-note-category"
                    >
                        📁 Egyéb
                    </span>

                    <h2 id="modalNoteTitle">
                        Jegyzet
                    </h2>

                </div>


                <button
                    id="closeNoteModal"
                    class="close-note-modal"
                    type="button"
                    aria-label="Bezárás"
                >

                    ✕

                </button>

            </div>



            <!-- SZÖVEG -->

            <div
                id="modalNoteText"
                class="note-modal-text"
            ></div>



            <!-- DÁTUM -->

            <div
                id="modalNoteDate"
                class="note-modal-date"
            ></div>

        </div>

    </div>



    <!-- JAVASCRIPT -->

    <script src="../script.js"></script>
    <script src="notes.js"></script>


</body>

</html>
