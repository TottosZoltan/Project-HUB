<!DOCTYPE html>
<html lang="hu">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Játékok - Project Hub</title>

    <link
        rel="stylesheet"
        href="../style.css"
    >

    <link
        rel="stylesheet"
        href="pages.css"
    >

    <link
        rel="stylesheet"
        href="games.css"
    >

</head>


<body>


    <!-- =========================================
         FEJLÉC
    ========================================== -->

    <header class="header">

        <div>

            <h1>JÁTÉKOK</h1>

            <p>Project Hub</p>

        </div>


        <a
            href="../"
            class="back-button"
        >

            <span class="back-arrow"></span>

        </a>

    </header>



    <!-- =========================================
         FŐ TARTALOM
    ========================================== -->

    <main class="page-content games-page">


        <!-- =====================================
             BEVEZETŐ
        ====================================== -->

        <section class="page-intro">

            <p class="small-title">
                PROJECT HUB
            </p>

            <h2>
                🎮 Játékok
            </h2>

            <p>
                A Steam játékidőd automatikusan megjelenik itt.
            </p>

        </section>



        <!-- =====================================
             STEAM JÁTÉKOK
        ====================================== -->

        <section class="page-section games-section">

            <div class="games-section-header">

                <div>

                    <h3>
                        Steam könyvtár
                    </h3>

                    <p>
                        Játékidő alapján rendezve
                    </p>

                </div>

            </div>


            <!-- Ide kerülnek majd a játékok -->

            <div
                id="gamesList"
                class="games-list"
            >

                <div class="games-loading">
                    Steam játékok betöltése...
                </div>

            </div>

        </section>


    </main>



    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script src="games.js"></script>


</body>

</html>
