<!DOCTYPE html>
<html lang="hu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project Hub</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">

        <div>
            <h1>PROJECT HUB</h1>
            <p>Saját személyes dashboard</p>
        </div>

        <button id="menuButton" class="menu-button">
            ☰
        </button>

    </header>


    <main>

        <section class="welcome">

            <p class="small-title">ÜDV ÚJRA 👋</p>

            <h2>Mit csináljunk ma?</h2>

            <p>
                Minden fontos dolgod egy helyen.
            </p>

        </section>


        <section class="apps">

            <a href="#" class="app-card">

                <span class="app-icon">📝</span>

                <div>
                    <h3>Jegyzetek</h3>
                    <p>Ötletek és jegyzetek</p>
                </div>

            </a>


            <a href="#" class="app-card">

                <span class="app-icon">✅</span>

                <div>
                    <h3>Feladatok</h3>
                    <p>Amit el kell intézni</p>
                </div>

            </a>


            <a href="#" class="app-card">

                <span class="app-icon">🎮</span>

                <div>
                    <h3>Játékok</h3>
                    <p>Játékaim és értékelések</p>
                </div>

            </a>


            <a href="#" class="app-card">

                <span class="app-icon">📍</span>

                <div>
                    <h3>Helyek</h3>
                    <p>Érdekes helyek</p>
                </div>

            </a>

        </section>


        <section class="overview">

            <div class="section-header">

                <h2>📊 Áttekintés</h2>

                <span>Ma</span>

            </div>


            <div class="stats">

                <div class="stat">
                    <strong id="taskCount">0</strong>
                    <span>Feladat</span>
                </div>

                <div class="stat">
                    <strong id="noteCount">0</strong>
                    <span>Jegyzet</span>
                </div>

                <div class="stat">
                    <strong id="gameCount">0</strong>
                    <span>Játék</span>
                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
